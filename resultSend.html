<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>資料送出中…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4d3f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg-deep: #1f4d3f;
      --bg-mid: #2f6b57;
      --surface: #fffcf8;
      --ink: #1c2b26;
      --ink-muted: #5c6f67;
      --accent: #2f6b57;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 100% 0%, rgba(180, 214, 198, 0.35), transparent 50%),
        linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-mid) 42%, #6a9b86 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .card {
      width: min(100%, 420px);
      background: var(--surface);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(28, 43, 38, 0.18);
      padding: 36px 24px;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 3px solid #d5e0da;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-muted);
    }

    .card.is-done .spinner { display: none; }
  </style>
</head>

<body>
  <div class="card" id="statusCard">
    <div class="spinner" aria-hidden="true"></div>
    <h1>正在送出預約</h1>
    <p id="statusText">請稍候，我們正在處理您的資料…</p>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyQtofbqcopsSQtjI-TqS1h4NX9QV_H_IefzhMzkZalHyiOhY_WhgDX-M2DDa9Xc5nJkg/exec";

    const SERVICE_LABELS = {
      project1: "全身筋絡指壓",
      project2: "全身芳療油壓",
      project3: "全身筋絡油指壓",
      project4: "全身 SPA 去角質",
      project5: "熱石能量精油舒壓",
      project6: "足部按摩"
    };

    function getParam(url, key) {
      return (url.searchParams.get(key) || "").trim();
    }

    function buildServiceLines(data) {
      return Object.keys(SERVICE_LABELS)
        .filter((key) => data[key])
        .map((key) => `・${SERVICE_LABELS[key]}：${data[key]}`);
    }

    function setStatus(title, text, done) {
      document.querySelector("#statusCard h1").textContent = title;
      document.getElementById("statusText").textContent = text;
      if (done) document.getElementById("statusCard").classList.add("is-done");
    }

    (async () => {
      try {
        await liff.init({
          liffId: "2010867466-OpLuakfe",
          withLoginOnExternalBrowser: false
        });
      } catch (e) {
        console.error("LIFF init failed:", e);
      }

      const url = new URL(location.href);

      const data = {
        uid: getParam(url, "uid"),
        email: getParam(url, "email"),
        name: getParam(url, "name"),
        phone: getParam(url, "phone"),
        date: getParam(url, "date"),
        slot: getParam(url, "slot"),
        time: getParam(url, "time"),
        adult: getParam(url, "adult"),
        project1: getParam(url, "project1"),
        project2: getParam(url, "project2"),
        project3: getParam(url, "project3"),
        project4: getParam(url, "project4"),
        project5: getParam(url, "project5"),
        project6: getParam(url, "project6"),
        note: getParam(url, "note") || "無"
      };

      /* 1. 寫入 Google Sheet */
      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });
      } catch (e) {
        console.error("試算表寫入錯誤:", e);
      }

      /* 2. 若不在 LINE App 內 */
      if (!liff.isInClient()) {
        setStatus("資料已送出", "請回到 LINE App 查看確認訊息。", true);
        return;
      }

      /* 3. 傳文字訊息 */
      const serviceLines = buildServiceLines(data);
      const serviceBlock = serviceLines.length
        ? serviceLines.join("\n")
        : "・尚未選擇服務";

      const msg =
`📌 您的 SPA 預約資訊

👤 姓名：${data.name}
📱 手機：${data.phone}
📅 日期：${data.date}
🕐 時段：${data.slot}
⏰ 時間：${data.time}
🧑 人數：${data.adult} 位

💆 服務項目
${serviceBlock}

📝 備註：${data.note}

我們已收到您的預約，將盡快與您確認！`;

      try {
        await liff.sendMessages([
          { type: "text", text: msg }
        ]);
      } catch (e) {
        alert("訊息發送失敗：" + e);
        console.error(e);
      }

      liff.closeWindow();
    })();
  </script>
</body>
</html>
