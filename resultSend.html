<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>資料送出中…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4d3f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg-deep: #1f4d3f;
      --bg-mid: #2f6b57;
      --surface: #fffcf8;
      --ink: #1c2b26;
      --ink-muted: #5c6f67;
      --accent: #2f6b57;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 100% 0%, rgba(180, 214, 198, 0.35), transparent 50%),
        linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-mid) 42%, #6a9b86 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .card {
      width: min(100%, 420px);
      background: var(--surface);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(28, 43, 38, 0.18);
      padding: 36px 24px;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 3px solid #d5e0da;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-muted);
    }

    .card.is-done .spinner { display: none; }
  </style>
</head>

<body>
  <div class="card" id="statusCard">
    <div class="spinner" aria-hidden="true"></div>
    <h1>正在送出預約</h1>
    <p id="statusText">請稍候，我們正在處理您的資料…</p>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzzjJkXbBsx0EYNBW7v43v7DK2H6HUtmGsBSkBTs7iqq6JKVM8fa5-J8orkmqtYTWst6w/exec";

    const SERVICE_LABELS = {
      project1: "全身筋絡指壓",
      project2: "全身芳療油壓",
      project3: "全身筋絡油指壓",
      project4: "全身 SPA 去角質",
      project5: "熱石能量精油舒壓",
      project6: "足部按摩"
    };

    function getParam(url, key) {
      return (url.searchParams.get(key) || "").trim();
    }

    function setStatus(title, text, done) {
      document.querySelector("#statusCard h1").textContent = title;
      document.getElementById("statusText").textContent = text;
      if (done) document.getElementById("statusCard").classList.add("is-done");
    }

    function infoRow(label, value) {
      return {
        type: "box",
        layout: "baseline",
        spacing: "sm",
        contents: [
          {
            type: "text",
            text: label,
            color: "#8A9A93",
            size: "sm",
            flex: 2,
            wrap: true
          },
          {
            type: "text",
            text: value || "-",
            color: "#1C2B26",
            size: "sm",
            flex: 5,
            wrap: true,
            weight: "bold"
          }
        ]
      };
    }

    function buildServiceRows(data) {
      const rows = Object.keys(SERVICE_LABELS)
        .filter((key) => data[key])
        .map((key) => ({
          type: "box",
          layout: "vertical",
          spacing: "xs",
          margin: "sm",
          contents: [
            {
              type: "text",
              text: SERVICE_LABELS[key],
              size: "sm",
              color: "#2F6B57",
              weight: "bold",
              wrap: true
            },
            {
              type: "text",
              text: data[key],
              size: "sm",
              color: "#555555",
              wrap: true
            }
          ]
        }));

      if (!rows.length) {
        rows.push({
          type: "text",
          text: "尚未選擇服務",
          size: "sm",
          color: "#999999"
        });
      }

      return rows;
    }

    function buildFlexMessage(data) {
      return {
        type: "flex",
        altText: "SPA 預約確認｜" + data.date + " " + data.time,
        contents: {
          type: "bubble",
          size: "mega",
          header: {
            type: "box",
            layout: "vertical",
            backgroundColor: "#1F4D3F",
            paddingAll: "20px",
            contents: [
              {
                type: "text",
                text: "SPA RESERVATION",
                color: "#A8C5B8",
                size: "xs",
                weight: "bold"
              },
              {
                type: "text",
                text: "預約已送出",
                color: "#FFFFFF",
                size: "xl",
                weight: "bold",
                margin: "md"
              },
              {
                type: "text",
                text: "我們已收到您的預約，將盡快與您確認",
                color: "#D5E0DA",
                size: "xs",
                margin: "sm",
                wrap: true
              }
            ]
          },
          body: {
            type: "box",
            layout: "vertical",
            spacing: "lg",
            paddingAll: "20px",
            backgroundColor: "#FFFCF8",
            contents: [
              {
                type: "box",
                layout: "vertical",
                spacing: "sm",
                contents: [
                  {
                    type: "text",
                    text: "預約資訊",
                    weight: "bold",
                    size: "md",
                    color: "#1C2B26"
                  },
                  infoRow("姓名", data.name),
                  infoRow("手機", data.phone),
                  infoRow("日期", data.date),
                  infoRow("時段", data.slot),
                  infoRow("時間", data.time),
                  infoRow("人數", (data.adult || "-") + " 位")
                ]
              },
              {
                type: "separator",
                color: "#D5E0DA"
              },
              {
                type: "box",
                layout: "vertical",
                spacing: "sm",
                contents: [
                  {
                    type: "text",
                    text: "服務項目",
                    weight: "bold",
                    size: "md",
                    color: "#1C2B26"
                  }
                ].concat(buildServiceRows(data))
              },
              {
                type: "separator",
                color: "#D5E0DA"
              },
              {
                type: "box",
                layout: "vertical",
                spacing: "sm",
                contents: [
                  {
                    type: "text",
                    text: "備註",
                    weight: "bold",
                    size: "md",
                    color: "#1C2B26"
                  },
                  {
                    type: "text",
                    text: data.note || "無",
                    size: "sm",
                    color: "#555555",
                    wrap: true
                  }
                ]
              }
            ]
          },
          footer: {
            type: "box",
            layout: "vertical",
            spacing: "sm",
            paddingAll: "16px",
            backgroundColor: "#F4F7F5",
            contents: [
              {
                type: "text",
                text: "如需修改，請私訊或來電聯繫我們",
                size: "xs",
                color: "#8A9A93",
                align: "center",
                wrap: true
              }
            ]
          },
          styles: {
            footer: {
              separator: true
            }
          }
        }
      };
    }

    (async () => {
      try {
        await liff.init({
          liffId: "2010867466-OpLuakfe",
          withLoginOnExternalBrowser: false
        });
      } catch (e) {
        console.error("LIFF init failed:", e);
      }

      const url = new URL(location.href);

      const data = {
        uid: getParam(url, "uid"),
        email: getParam(url, "email"),
        name: getParam(url, "name"),
        phone: getParam(url, "phone"),
        date: getParam(url, "date"),
        slot: getParam(url, "slot"),
        time: getParam(url, "time"),
        adult: getParam(url, "adult"),
        project1: getParam(url, "project1"),
        project2: getParam(url, "project2"),
        project3: getParam(url, "project3"),
        project4: getParam(url, "project4"),
        project5: getParam(url, "project5"),
        project6: getParam(url, "project6"),
        note: getParam(url, "note") || "無"
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });
      } catch (e) {
        console.error("試算表寫入錯誤:", e);
      }

      if (!liff.isInClient()) {
        setStatus("資料已送出", "請回到 LINE App 查看確認訊息。", true);
        return;
      }

      try {
        await liff.sendMessages([buildFlexMessage(data)]);
      } catch (e) {
        alert("訊息發送失敗：" + e);
        console.error(e);
      }

      liff.closeWindow();
    })();
  </script>
</body>
</html>
