<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>資料送出中…</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  body {
    font-family: "Noto Sans TC", sans-serif;
    background: #f2f2f2;
    text-align: center;
    padding: 40px;
    font-size: 20px;
  }
</style>
</head>

<body>
<p>正在送出您的預約資料…</p>

<script>
// ⭐ 你的 GAS 網址
const API_URL = "https://script.google.com/macros/s/AKfycbzOTOJTDCJNjTW-j_QAzTBQfsVukcIiVLeQwrGjgkmXR1vVQ0XTYdGn0FvovULfFIC0/exec";

(async () => {

  await liff.init({
    liffId: "2010867466-OpLuakfe",
    withLoginOnExternalBrowser: false
  });

  const url = new URL(location.href);

  const data = {
    uid:   url.searchParams.get("uid"),
    name:  url.searchParams.get("name"),
    phone: url.searchParams.get("phone"),
    date:  url.searchParams.get("date"),
    time:  url.searchParams.get("time"),
    adult: url.searchParams.get("adult"),
    child: url.searchParams.get("child") || "0",
    chair: url.searchParams.get("chair") || "0",
    note:  url.searchParams.get("note") || "無"
  };


  /* ---------------------------
      1. 寫入 Google Sheet（修正版）
  ---------------------------- */
  try {
   await fetch(API_URL, {
  method: "POST",
  body: JSON.stringify(data)
});

  } catch (e) {
    console.error("❌ 試算表寫入錯誤:", e);
  }


  /* ---------------------------
      2. 若不是在 LINE
  ---------------------------- */
  if (!liff.isInClient()) {
    document.body.innerHTML = "<p>資料已送出，請回到 LINE App 查看。</p>";
    return;
  }


  /* ---------------------------
      3. 傳文字訊息（不用 Flex）
  ---------------------------- */
  const msg =
`📌 您的預約訂位資訊

👤 姓名：${data.name}
📱 手機：${data.phone}
📅 日期：${data.date}
⏰ 時段：${data.time}
🧑 大人：${data.adult} 位
🧒 小孩：${data.child} 位
🪑 兒童椅：${data.chair} 張
📝 備註：${data.note}

我們已收到您的預約，將盡快與您確認訂位！`;

  try {
    await liff.sendMessages([
      { type: "text", text: msg }
    ]);
  } catch (e) {
    alert("❌ 訊息發送失敗：" + e);
    console.error(e);
  }

  liff.closeWindow();

})();
</script>

</body>
</html>
