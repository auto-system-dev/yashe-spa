<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>資料送出中...</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <link rel="stylesheet" href="style.css">

  <style>
    body { text-align: center; padding: 40px; font-size: 26px; }
  </style>
</head>

<body>

<p>正在處理您的預訂，請稍候…</p>

<script>
(async () => {

  await liff.init({
    liffId: "2008409020-k4Oy7Y0D",
    withLoginOnExternalBrowser: false
  });

  if (!liff.isInClient()) {
    document.body.innerHTML = "<p>請在 LINE 中開啟此頁面。</p>";
    return;
  }

  const url = new URL(location.href);

  const name  = url.searchParams.get("name");
  const phone = url.searchParams.get("phone");
  const house = url.searchParams.get("house");
  const date  = url.searchParams.get("date");
  const days  = url.searchParams.get("days");
  const adult = url.searchParams.get("adult");
  const child = url.searchParams.get("child");
  const pet   = url.searchParams.get("pet") || "無";
  const note  = url.searchParams.get("note") || "無";

  /* ----------------------------------------------
     寫入 Google Sheet
     ---------------------------------------------- */
  await fetch(
    "https://script.google.com/macros/s/AKfycbxOGogJosiwQDHVm_pEBogYRtRnyJJdufBxoymfFGnK6FKPfcdfzU5l1jR9ztUkvQG4/exec",
    {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name, phone, house, date, days, adult, child, pet, note
      })
    }
  );

  /* ----------------------------------------------
     回傳訊息給使用者
     ---------------------------------------------- */
  const msg =
`📌 您的預訂資料如下：

👤 姓名：${name}
📱 手機：${phone}
🏡 館別：${house}
📅 包棟日期：${date}
🌙 包棟天數：${days} 晚
🧑 大人：${adult} 位
🧒 小孩：${child} 位
🐶 寵物：${pet}
📝 備註：${note}

我們已收到您的資訊，預訂確認中...`;

  await liff.sendMessages([
    { type: "text", text: msg }
  ]);

  liff.closeWindow();

})();
</script>

</body>
</html>
