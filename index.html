<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>LINE 預約SPA按摩</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- LIFF -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<!-- flatpickr -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h2>請填寫預約資訊</h2>

  <form id="liffForm">

    <!-- 隱藏資料 -->
    <input type="hidden" id="line_uid">
    <input type="hidden" id="line_email">

    <!-- 姓名 -->
    <div class="field-group">
      <label>姓名 <span class="label-required">*</span></label>
      <input type="text" id="name" required placeholder="請輸入姓名">
    </div>

    <!-- 手機 -->
    <div class="field-group">
      <label>手機號碼 <span class="label-required">*</span></label>
      <input type="tel" id="phone" required maxlength="10" placeholder="0912345678"
             pattern="09[0-9]{8}" inputmode="numeric">
    </div>


    <!-- 日期/時間 -->
 <div class="field-group">
  <label>預約日期/時間 <span class="label-required">*</span></label>
  <input id="datetime" type="datetime-local" required>
</div>


    <!-- 服務項目 -->
<div class="field-group">
  <label>全身筋絡指壓</label>
  <div>
    <input type="radio" id="massage-none" name="project1" value="none" required>
    <label for="massage-none">無</label><br>
    <input type="radio" id="massage-60" name="project1" value="60">
    <label for="massage-60">(60分鐘)$1,000</label><br>
    <input type="radio" id="massage-90" name="project1" value="90">
    <label for="massage-90">(90分鐘)$1,500</label><br>
    <input type="radio" id="massage-120" name="project1" value="120">
    <label for="massage-120">(120分鐘)$2,000</label>
  </div>
</div>

    
    <div class="field-group">
      <label>全身筋絡指壓</label>
      <select id="project1" required>
        <option value="" disabled selected>請選擇</option>
        <option>無</option>
        <option>全身筋絡指壓(60分鐘)$1,000</option>
        <option>全身筋絡指壓(90分鐘)$1,500</option>
        <option>全身筋絡指壓(120分鐘)$2,000</option>
        </select>
    </div>

        <div class="field-group">
      <label>全身芳療油壓</label>
      <select id="project2" required>
        <option value="" disabled selected>請選擇</option>
        <option>無</option>
        <option>全身芳療油壓(60分鐘)$1,100</option>
        </select>
    </div>

      <div class="field-group">
      <label>全身筋絡油指壓</label>
      <select id="project3" required>
        <option value="" disabled selected>請選擇</option>
        <option>無</option>
        <option>全身筋絡油指壓(90分鐘)$1,600</option>
        <option>全身筋絡油指壓(120分鐘)$2,000</option>
        </select>
    </div>

     <div class="field-group">
      <label>全身SPA去角質</label>
      <select id="project4" required>
        <option value="" disabled selected>請選擇</option>
        <option>無</option>
        <option>全身SPA去角質(60分鐘)$1,600</option>
        <option>全身SPA去角質(90分鐘)$2,100</option>
        <option>全身SPA去角質(120分鐘)$2,500</option>
        </select>
    </div>

         <div class="field-group">
      <label>熱石能量精油舒壓</label>
      <select id="project5" required>
        <option value="" disabled selected>請選擇</option>
        <option>無</option>
        <option>熱石能量精油舒壓(60分鐘)$2,100</option>
        <option>熱石能量精油舒壓(90分鐘)$2,600</option>
        <option>熱石能量精油舒壓(120分鐘)$3,000</option>
        </select>
    </div>

       <div class="field-group">
      <label>足部按摩</label>
      <select id="project6" required>
        <option value="" disabled selected>請選擇</option>
        <option>無</option>
        <option>足部按摩(60分鐘)$1,000</option>
      </select>
    </div>

    <!-- 人數 -->
    <div class="field-group">
      <label>人數 <span class="label-required">*</span></label>
      <select id="adult" required>
        <option value="" disabled selected>請選擇</option>
        <script>
          document.write(
            Array.from({length: 30}, (_, i) => i + 1)
            .map(n => `<option value="${n}">${n} 位</option>`)
            .join("")
          );
        </script>
      </select>
    </div>

    <!-- 備註 -->
    <div class="field-group">
      <label>備註</label>
      <textarea id="note" rows="3" placeholder="可填寫特殊需求…"></textarea>
    </div>

    <button type="submit">送出預約</button>

  </form>
</div>

<script>
async function initLIFF() {
  await liff.init({ liffId: "2010867466-OpLuakfe" });

  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: location.href });
    return;
  }

  const profile = await liff.getProfile();
  const token = liff.getDecodedIDToken();

  document.getElementById("line_uid").value = profile.userId;
  document.getElementById("line_email").value = token?.email || "";
  document.getElementById("displayName").innerText = profile.displayName;
}

function initDatePicker() {
  flatpickr("#date", {
    locale: "zh_tw",
    dateFormat: "Y-m-d",
    minDate: new Date().fp_incr(1)  // 今天不可選，從明天開始
  });
}

document.addEventListener("DOMContentLoaded", () => {
  initLIFF();
  initDatePicker();
});

document.getElementById("liffForm").addEventListener("submit", (e) => {
  e.preventDefault();

  const params = new URLSearchParams();

  ["line_uid","line_email","name","phone","date","time","adult","child","chair","note"]
    .forEach(id => params.append(id.replace("line_",""), document.getElementById(id).value));

  location.href = "resultSend.html?" + params.toString();
});
</script>

</body>
</html>
