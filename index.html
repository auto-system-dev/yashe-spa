<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>LINE 預約 SPA 按摩</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d88a6d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

  <!-- LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>

  <link rel="stylesheet" href="liff-spa-form.css?v=20260729today">
</head>

<body>
  <div class="page">
    <header class="hero">
      <p class="hero-eyebrow">Yashe Spa</p>
      <h1 class="hero-title">預約 SPA 按摩</h1>
      <p class="hero-sub">請填寫預約資訊，我們會盡快為您確認時段</p>
      <p class="hero-user" id="displayNameWrap" hidden>
        您好，<span id="displayName"></span>
      </p>
    </header>

    <main class="container">
      <form id="liffForm" class="form-card" novalidate>
        <input type="hidden" id="line_uid">
        <input type="hidden" id="line_email">

        <section class="form-section">
          <h2 class="section-title">預約時間</h2>
          <p class="section-desc">營業時間 10:00–24:00</p>

          <div class="field-group">
            <label for="date">預約日期 <span class="req">*</span></label>
            <input id="date" type="text" required placeholder="請選擇日期" inputmode="none" autocomplete="off">
          </div>

          <div class="field-group">
            <span class="field-label">預約時段 <span class="req">*</span></span>
            <input type="hidden" id="slot">
            <div class="chip-row" id="slotChips" role="group" aria-label="預約時段">
              <button type="button" class="chip-btn" data-slot="早上">
                <span class="chip-title">早上</span>
                <span class="chip-sub">10:00–12:00</span>
              </button>
              <button type="button" class="chip-btn" data-slot="下午">
                <span class="chip-title">下午</span>
                <span class="chip-sub">12:30–17:00</span>
              </button>
              <button type="button" class="chip-btn" data-slot="晚上">
                <span class="chip-title">晚上</span>
                <span class="chip-sub">17:30–23:00</span>
              </button>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">預約時間 <span class="req">*</span></span>
            <input type="hidden" id="time">
            <p class="field-hint" id="timeHint">請先選擇時段</p>
            <div class="time-grid" id="timeGrid" hidden></div>
          </div>
        </section>

        <section class="form-section">
          <h2 class="section-title">基本資料</h2>

          <div class="field-group">
            <label for="name">姓名 <span class="req">*</span></label>
            <input type="text" id="name" required placeholder="請輸入姓名" autocomplete="name">
          </div>

          <div class="field-group">
            <label for="phone">手機號碼 <span class="req">*</span></label>
            <input
              type="tel"
              id="phone"
              required
              maxlength="10"
              placeholder="0912345678"
              pattern="09[0-9]{8}"
              inputmode="numeric"
              autocomplete="tel"
            >
            <p class="field-hint">請輸入 09 開頭的 10 碼手機號碼</p>
          </div>

          <div class="field-group">
            <label for="adult">人數 <span class="req">*</span></label>
            <select id="adult" required>
              <option value="" disabled selected>請選擇</option>
            </select>
          </div>
        </section>

        <section class="form-section">
          <h2 class="section-title">服務項目 <span class="req">*</span></h2>
          <p class="section-desc">請至少選擇一項服務與時長</p>

          <div class="service-list">
            <div class="field-group service-item">
              <label for="project1">全身筋絡指壓</label>
              <select id="project1">
                <option value="" selected>請選擇</option>
                <option value="(60分鐘)$1,000">(60分鐘) $1,000</option>
                <option value="(90分鐘)$1,500">(90分鐘) $1,500</option>
                <option value="(120分鐘)$2,000">(120分鐘) $2,000</option>
              </select>
            </div>

            <div class="field-group service-item">
              <label for="project2">全身芳療油壓</label>
              <select id="project2">
                <option value="" selected>請選擇</option>
                <option value="(60分鐘)$1,100">(60分鐘) $1,100</option>
              </select>
            </div>

            <div class="field-group service-item">
              <label for="project3">全身筋絡油指壓</label>
              <select id="project3">
                <option value="" selected>請選擇</option>
                <option value="(90分鐘)$1,600">(90分鐘) $1,600</option>
                <option value="(120分鐘)$2,000">(120分鐘) $2,000</option>
              </select>
            </div>

            <div class="field-group service-item">
              <label for="project4">全身 SPA 去角質</label>
              <select id="project4">
                <option value="" selected>請選擇</option>
                <option value="(60分鐘)$1,600">(60分鐘) $1,600</option>
                <option value="(90分鐘)$2,100">(90分鐘) $2,100</option>
                <option value="(120分鐘)$2,500">(120分鐘) $2,500</option>
              </select>
            </div>

            <div class="field-group service-item">
              <label for="project5">熱石能量精油舒壓</label>
              <select id="project5">
                <option value="" selected>請選擇</option>
                <option value="(60分鐘)$2,100">(60分鐘) $2,100</option>
                <option value="(90分鐘)$2,600">(90分鐘) $2,600</option>
                <option value="(120分鐘)$3,000">(120分鐘) $3,000</option>
              </select>
            </div>

            <div class="field-group service-item">
              <label for="project6">足部按摩</label>
              <select id="project6">
                <option value="" selected>請選擇</option>
                <option value="(60分鐘)$1,000">(60分鐘) $1,000</option>
              </select>
            </div>
          </div>
        </section>

        <section class="form-section form-section--last">
          <h2 class="section-title">備註</h2>
          <div class="field-group">
            <label for="note">其他需求（選填）</label>
            <textarea id="note" rows="3" placeholder="例如：希望較輕力道、身體不適部位等"></textarea>
          </div>
        </section>

        <p class="form-error" id="formError" hidden></p>

        <button type="submit" class="submit-btn" id="submitBtn">
          送出預約
        </button>
      </form>
    </main>
  </div>

  <script>
    const ADULT_SELECT = document.getElementById("adult");
    for (let i = 1; i <= 10; i++) {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = i + " 位";
      ADULT_SELECT.appendChild(opt);
    }

    const SLOT_TIMES = {
      "早上": ["10:00", "10:30", "11:00", "11:30", "12:00"],
      "下午": ["12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00"],
      "晚上": ["17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00", "21:30", "22:00", "22:30", "23:00"]
    };

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function todayStr() {
      const now = new Date();
      return now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
    }

    function isSelectedDateToday() {
      return document.getElementById("date").value === todayStr();
    }

    function timeToMinutes(t) {
      const parts = t.split(":");
      return Number(parts[0]) * 60 + Number(parts[1]);
    }

    function getAvailableTimes(slot) {
      const times = SLOT_TIMES[slot] || [];
      if (!isSelectedDateToday()) return times.slice();

      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      // 僅保留「現在之後」的時段
      return times.filter((t) => timeToMinutes(t) > nowMinutes);
    }

    function updateSlotAvailability() {
      document.querySelectorAll("#slotChips .chip-btn").forEach((btn) => {
        const slot = btn.dataset.slot;
        const available = getAvailableTimes(slot);
        const disabled = available.length === 0;
        btn.disabled = disabled;
        btn.classList.toggle("is-disabled", disabled);
        if (disabled && btn.classList.contains("is-active")) {
          btn.classList.remove("is-active");
          document.getElementById("slot").value = "";
          document.getElementById("time").value = "";
          document.getElementById("timeGrid").hidden = true;
          document.getElementById("timeHint").textContent = "此時段今日已無可預約時間，請改選其他時段或日期";
        }
      });
    }

    function renderTimeGrid(slot) {
      const timeInput = document.getElementById("time");
      const timeGrid = document.getElementById("timeGrid");
      const timeHint = document.getElementById("timeHint");
      const times = getAvailableTimes(slot);

      timeInput.value = "";

      if (!times.length) {
        timeGrid.innerHTML = "";
        timeGrid.hidden = true;
        timeHint.textContent = isSelectedDateToday()
          ? "今日此一時段已過，請改選其他時段或日期"
          : "目前無可選時間";
        return;
      }

      timeGrid.innerHTML = times.map((t) =>
        `<button type="button" class="time-btn" data-time="${t}">${t}</button>`
      ).join("");
      timeGrid.hidden = false;
      timeHint.textContent = isSelectedDateToday()
        ? "僅顯示現在之後可預約的時間"
        : "請選擇開始時間";
    }

    function initSlotTimePicker() {
      const slotInput = document.getElementById("slot");
      const timeInput = document.getElementById("time");
      const timeGrid = document.getElementById("timeGrid");

      document.getElementById("slotChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-slot]");
        if (!btn || btn.disabled) return;

        if (!document.getElementById("date").value) {
          showError("請先選擇預約日期");
          return;
        }

        const slot = btn.dataset.slot;
        slotInput.value = slot;

        document.querySelectorAll("#slotChips .chip-btn").forEach((el) => {
          el.classList.toggle("is-active", el === btn);
        });
        document.getElementById("slotChips").classList.remove("is-invalid");
        document.getElementById("timeGrid").classList.remove("is-invalid");
        showError("");

        renderTimeGrid(slot);
      });

      timeGrid.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-time]");
        if (!btn) return;

        timeInput.value = btn.dataset.time;
        timeGrid.querySelectorAll(".time-btn").forEach((el) => {
          el.classList.toggle("is-active", el === btn);
        });
        timeGrid.classList.remove("is-invalid");
        showError("");
      });
    }

    async function initLIFF() {
      try {
        await liff.init({ liffId: "2010867466-OpLuakfe" });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }

        const profile = await liff.getProfile();
        const token = liff.getDecodedIDToken();

        document.getElementById("line_uid").value = profile.userId || "";
        document.getElementById("line_email").value = token?.email || "";

        if (profile.displayName) {
          document.getElementById("displayName").textContent = profile.displayName;
          document.getElementById("displayNameWrap").hidden = false;
        }
      } catch (err) {
        console.error("LIFF init failed:", err);
      }
    }

    function initDatePicker() {
      flatpickr("#date", {
        locale: "zh_tw",
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "Y年 m月 d日",
        minDate: "today",
        disableMobile: true,
        onChange: () => {
          updateSlotAvailability();
          const slot = document.getElementById("slot").value;
          if (slot) {
            renderTimeGrid(slot);
          } else {
            document.getElementById("time").value = "";
            document.getElementById("timeGrid").hidden = true;
            document.getElementById("timeHint").textContent = "請先選擇時段";
          }
          showError("");
        }
      });
    }

    function showError(message) {
      const el = document.getElementById("formError");
      el.textContent = message;
      el.hidden = !message;
      if (message) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function clearFieldErrors() {
      document.querySelectorAll(".is-invalid").forEach((el) => {
        el.classList.remove("is-invalid");
      });
    }

    function markInvalid(el) {
      if (!el) return;
      el.classList.add("is-invalid");
    }

    function focusField(el) {
      if (!el) return;
      if (typeof el.focus === "function") {
        try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
      }
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function validateForm() {
      clearFieldErrors();

      const dateEl = document.getElementById("date");
      const dateValue = (dateEl.value || "").trim();
      if (!dateValue) {
        const visibleDate = dateEl.nextElementSibling && dateEl.nextElementSibling.classList.contains("form-control")
          ? dateEl.nextElementSibling
          : (document.querySelector(".flatpickr-input") || dateEl);
        markInvalid(visibleDate);
        markInvalid(dateEl);
        showError("請選擇預約日期");
        focusField(visibleDate);
        return false;
      }

      const slotEl = document.getElementById("slot");
      if (!slotEl.value) {
        markInvalid(document.getElementById("slotChips"));
        showError("請選擇預約時段");
        focusField(document.getElementById("slotChips"));
        return false;
      }

      const timeEl = document.getElementById("time");
      if (!timeEl.value) {
        markInvalid(document.getElementById("timeGrid"));
        showError("請選擇預約時間");
        focusField(document.getElementById("timeGrid"));
        return false;
      }

      // 若選當天，再次確認時段仍在現在之後
      if (isSelectedDateToday()) {
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        if (timeToMinutes(timeEl.value) <= nowMinutes) {
          markInvalid(document.getElementById("timeGrid"));
          showError("所選時間已過，請重新選擇現在之後的時段");
          updateSlotAvailability();
          const slot = document.getElementById("slot").value;
          if (slot) renderTimeGrid(slot);
          return false;
        }
      }

      const nameEl = document.getElementById("name");
      if (!nameEl.value.trim()) {
        markInvalid(nameEl);
        showError("請輸入姓名");
        focusField(nameEl);
        return false;
      }

      const phoneEl = document.getElementById("phone");
      const phone = phoneEl.value.trim();
      if (!phone) {
        markInvalid(phoneEl);
        showError("請輸入手機號碼");
        focusField(phoneEl);
        return false;
      }
      if (!/^09\d{8}$/.test(phone)) {
        markInvalid(phoneEl);
        showError("請輸入正確的手機號碼（09 開頭共 10 碼）");
        focusField(phoneEl);
        return false;
      }

      const adultEl = document.getElementById("adult");
      if (!adultEl.value) {
        markInvalid(adultEl);
        showError("請選擇人數");
        focusField(adultEl);
        return false;
      }

      const projects = ["project1", "project2", "project3", "project4", "project5", "project6"];
      const hasService = projects.some((id) => document.getElementById(id).value);
      if (!hasService) {
        projects.forEach((id) => markInvalid(document.getElementById(id)));
        markInvalid(document.querySelector(".service-list"));
        showError("請至少選擇一項服務");
        focusField(document.getElementById("project1"));
        return false;
      }

      showError("");
      return true;
    }

    document.addEventListener("DOMContentLoaded", () => {
      initLIFF();
      initDatePicker();
      initSlotTimePicker();
      updateSlotAvailability();

      // 填寫時清除錯誤狀態
      document.getElementById("liffForm").addEventListener("input", (e) => {
        if (e.target.classList.contains("is-invalid")) {
          e.target.classList.remove("is-invalid");
        }
        if (!document.getElementById("formError").hidden) {
          showError("");
        }
      });
      document.getElementById("liffForm").addEventListener("change", (e) => {
        if (e.target.classList.contains("is-invalid")) {
          e.target.classList.remove("is-invalid");
        }
      });
    });

    document.getElementById("liffForm").addEventListener("submit", (e) => {
      e.preventDefault();

      if (!validateForm()) return;

      const params = new URLSearchParams();
      const fields = [
        ["uid", "line_uid"],
        ["email", "line_email"],
        ["name", "name"],
        ["phone", "phone"],
        ["date", "date"],
        ["slot", "slot"],
        ["time", "time"],
        ["adult", "adult"],
        ["project1", "project1"],
        ["project2", "project2"],
        ["project3", "project3"],
        ["project4", "project4"],
        ["project5", "project5"],
        ["project6", "project6"],
        ["note", "note"]
      ];

      fields.forEach(([key, id]) => {
        params.append(key, document.getElementById(id).value || "");
      });

      params.set("v", "20260729today");
      location.href = "resultSend.html?" + params.toString();
    });
  </script>
</body>
</html>
